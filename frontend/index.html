
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatterBox | Connect. Share. Express.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>¬_¬  ChatterBox</h1>
        <p>Connect  Share  Express </p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome to ChatterBox!</h2>
            <p>Share your thoughts with the world.</p>
        </section>

        <!-- Authentication Section -->
        <section class="auth-section" id="authSection">

            <div class="auth-switch">
                <button type="button" id="showLogin">Login</button>
                <button type="button" id="showRegister">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <h2>Welcome Back!</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" hidden>
                <h2>Create Your Account</h2>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">Register</button>
            </form>

            <p id="authMessage"></p>

        </section>

        <!-- Main App Section -->
        <div id="appSection" hidden>
            <button id="logoutButton">Logout</button>

            <section class="create-post">
                <h2>Create a Post</h2>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your name"
                >

                <textarea
                    id="postContent"
                    placeholder="What's on your mind?"
                ></textarea>

                <button id="postButton">Share Post</button>
            </section>

            <section class="feed">
                <h2>Latest Posts</h2>
                <div id="postsContainer">
                    <p>Loading posts...</p>
                </div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
